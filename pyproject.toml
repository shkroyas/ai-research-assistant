[project]
name = "market-research"
version = "0.1.0"
description = "Multi-agent market research assistant: Orchestrator, Researcher, Analyst and Critic produce a sourced research brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tavily-python>=0.5",
    "anthropic[bedrock]>=0.70",
    "groq>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: calls real external APIs (skipped in CI)"]

[tool.coverage.run]
source = ["src/market_research"]
branch = true
