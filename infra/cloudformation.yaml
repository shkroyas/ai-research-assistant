AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AI research assistant on ECS Fargate behind an Application Load Balancer (spec 003).
  The image lives in ECR and the API keys in Secrets Manager; both are created by
  infra/deploy.sh so that no key value ever passes through this template.

Parameters:
  AppName:
    Type: String
    Default: ai-research-assistant
    Description: Name used for the cluster, service, task family, roles and tags.
  ImageUri:
    Type: String
    Description: Full ECR image URI including the tag, for example <account>.dkr.ecr.us-east-1.amazonaws.com/ai-research-assistant:<sha>.
  SecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding GROQ_API_KEYS and TAVILY_API_KEY as JSON.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Number of tasks. Raise it to scale out (R1.5).
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "1024"
    Description: MiB. Must be a valid Fargate pairing with TaskCpu.
  LlmProviders:
    Type: String
    Default: bedrock,groq
    Description: Providers in the model picker; the first is the default.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-opus-4-6-v1
    Description: Inference profile id the app calls.
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-opus-4-6-v1
    Description: Foundation model behind the inference profile, needed for the IAM policy.
  GroqModel:
    Type: String
    Default: openai/gpt-oss-120b
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate for a domain you own. When set, the load balancer serves HTTPS and redirects HTTP.
  GitHubRepo:
    Type: String
    Default: shkroyas/ai-research-assistant
    Description: owner/name of the repository allowed to deploy through OIDC (R1.4).
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional email for AWS Budget alerts. Leave empty to skip the budget.
  BudgetLimitUsd:
    Type: Number
    Default: 30

Conditions:
  UseHttps: !Not [!Equals [!Ref CertificateArn, ""]]
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # ---------------------------------------------------------------- Network
  # Two public subnets and no NAT gateway: the task gets a public IP to reach
  # ECR, Bedrock, Groq and Tavily, and its security group only admits the ALB.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Ref AppName }
        - { Key: project, Value: !Ref AppName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: project, Value: !Ref AppName }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-public-a" }
        - { Key: project, Value: !Ref AppName }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${AppName}-public-b" }
        - { Key: project, Value: !Ref AppName }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: project, Value: !Ref AppName }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public web traffic to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: project, Value: !Ref AppName }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Streamlit port, reachable only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: project, Value: !Ref AppName }

  # ---------------------------------------------------------------- Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref AppName
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # Streamlit keeps a WebSocket open for the whole session.
        - { Key: idle_timeout.timeout_seconds, Value: "300" }
      Tags:
        - { Key: project, Value: !Ref AppName }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Ref AppName
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8501
      TargetType: ip
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        # Sticky sessions keep a browser on the task that holds its Streamlit session.
        - { Key: stickiness.enabled, Value: "true" }
        - { Key: stickiness.type, Value: lb_cookie }
        - { Key: stickiness.lb_cookie.duration_seconds, Value: "86400" }
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Tags:
        - { Key: project, Value: !Ref AppName }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - UseHttps
        - - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseHttps
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- IAM
  # Pulls the image, writes logs and reads the one secret at task start.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn
      Tags:
        - { Key: project, Value: !Ref AppName }

  # The app's own identity: InvokeModel on the chosen model only (R1.3).
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-chosen-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  # The cross-region inference profile, and the model it routes to in each region.
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - !Sub "arn:aws:bedrock:*::foundation-model/${BedrockFoundationModelId}"
      Tags:
        - { Key: project, Value: !Ref AppName }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
      Tags:
        - { Key: project, Value: !Ref AppName }

  # Assumed by GitHub Actions on pushes to main, with no stored AWS keys (R1.4).
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: push-image-and-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AppName}"
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${AppName}/${AppName}"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]
      Tags:
        - { Key: project, Value: !Ref AppName }

  # ---------------------------------------------------------------- ECS
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 7

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AppName
      Tags:
        - { Key: project, Value: !Ref AppName }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AppName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - { ContainerPort: 8501, Protocol: tcp }
          Environment:
            - { Name: LLM_PROVIDERS, Value: !Ref LlmProviders }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: BEDROCK_MODEL_ID, Value: !Ref BedrockModelId }
            - { Name: BEDROCK_API, Value: invoke }
            - { Name: GROQ_MODEL, Value: !Ref GroqModel }
            - { Name: SCRAPE_PAGES, Value: "true" }
            - { Name: READ_PDFS, Value: "false" }
            - { Name: LOG_LEVEL, Value: INFO }
          Secrets:
            - Name: GROQ_API_KEYS
              ValueFrom: !Sub "${SecretArn}:GROQ_API_KEYS::"
            - Name: TAVILY_API_KEY
              ValueFrom: !Sub "${SecretArn}:TAVILY_API_KEY::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: app
      Tags:
        - { Key: project, Value: !Ref AppName }

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Ref AppName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      # Rolling deploys: start the new task before stopping the old one, roll back on failure.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup
      PropagateTags: SERVICE
      Tags:
        - { Key: project, Value: !Ref AppName }

  # ---------------------------------------------------------------- Budget
  Budget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub "${AppName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetLimitUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  AppUrl:
    Description: Public address of the app.
    Value: !If
      - UseHttps
      - !Sub "https://${LoadBalancer.DNSName}"
      - !Sub "http://${LoadBalancer.DNSName}"
  LoadBalancerDnsName:
    Description: Point a CNAME at this when using your own domain.
    Value: !GetAtt LoadBalancer.DNSName
  DeployRoleArn:
    Description: Set as the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
